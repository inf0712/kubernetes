apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-prod
  namespace: production

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web
  
  template:
    metadata:
      labels:
        app: web


    spec:
      containers:
        - name: prod-con
          image: nginx:alpine
          ports:
            - containerPort: 80
