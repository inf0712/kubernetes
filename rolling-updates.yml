apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-ups

spec:
  replicas: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 1


  selector:
    matchLabels:
      name: gojo

  template:
    metadata:
      labels:
        name: gojo

    spec:
      containers:
        - name: yuji
          image: nginx:alpine
          ports:
            - containerPort: 80

