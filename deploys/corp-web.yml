apiVersion: apps/v1
kind: Deployment
metadata:
  name: corporate-web
  namespace: web-production

spec:
  replicas: 3

  selector:
    matchLabels:
      app: corporate-web
      tier: frontend

  template:
      metadata:
        labels:
          app: corporate-web
          tier: frontend

      spec:
        containers:
          - name: web-con
            image: nginx:alpine
            ports:
              - containerPort: 80

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "500m"

