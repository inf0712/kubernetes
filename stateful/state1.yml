apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web

spec:
  serviceName: web-svc
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: cons
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80

      volumeMounts:
          - name: web-data
            mountPath: /usr/share/nginx/html

  volumeClaimTemplates:
        - metadata:
            name: web-disk

        spec:
            accessModes:
              - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi
