apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-deploy
 
spec:
  replicas: 5
 
  selector:
    matchLabels:
      name: alpha
 
  template:
    metadata:
      labels:
        name: alpha
 
    spec:
      containers:
        - name: rtr
          image: nginx:alpine
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: static-svc
spec:
  type: ClusterIP
  selector:
    name: alpha
  ports:
    - port: 8090
      targetPort: 80
