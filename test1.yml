apiVersion: v1
kind: Pod
metadata:
  name: infinite
  labels:
    env: void
    name: beta


spec:
  containers:
    - name: satoru
      image: nginx:alpine
      ports:
        - containerPort: 80

      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"

        limits:
          memory: "256Mi"
          cpu: "200m"
